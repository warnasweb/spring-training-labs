name: Day 8 security microservices
on:
  push:
    paths: ['examples/day8-security/**', '.github/workflows/day8-security.yml']
  pull_request:
    paths: ['examples/day8-security/**', '.github/workflows/day8-security.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/day8-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - run: docker compose -f docker-compose.yml -f docker-compose.discovery.yml --profile apps --profile discovery up --build -d
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.discovery.yml --profile apps --profile discovery logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day8-security-test-results
          path: |
            examples/day8-security/**/target/surefire-reports/
            examples/day8-security/compose.log
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.discovery.yml --profile apps --profile discovery down
