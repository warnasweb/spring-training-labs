name: day7
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  product-db:
    image: postgres:17.4
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: product
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
    volumes: ["product-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 5s
      timeout: 3s
      retries: 20
  product-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: product-service
    ports: ["127.0.0.1:8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product
      DB_PASSWORD: ${POSTGRES_PASSWORD:-training}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  inventory-db:
    image: postgres:17.4
    ports: ["127.0.0.1:5434:5432"]
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
    volumes: ["inventory-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
  inventory-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: inventory-service
    ports: ["127.0.0.1:8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      DB_PASSWORD: ${POSTGRES_PASSWORD:-training}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  order-db:
    image: postgres:17.4
    ports: ["127.0.0.1:5435:5432"]
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
    volumes: ["order-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 3s
      retries: 20
  order-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: order-service
    ports: ["127.0.0.1:8083:8083"]
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order
      DB_PASSWORD: ${POSTGRES_PASSWORD:-training}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  payment-db:
    image: postgres:17.4
    ports: ["127.0.0.1:5436:5432"]
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-training}
    volumes: ["payment-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 20
  payment-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: payment-service
    ports: ["127.0.0.1:8084:8084"]
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment
      DB_PASSWORD: ${POSTGRES_PASSWORD:-training}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
