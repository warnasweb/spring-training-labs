      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: api-gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PRODUCT_URL: http://product-service:8081
      INVENTORY_URL: http://inventory-service:8082
      ORDER_URL: http://order-service:8083
      PAYMENT_URL: http://payment-service:8084
      NOTIFICATION_URL: http://notification-service:8085
volumes:
  kafka-data:
  product-data:
  inventory-data:
  order-data:
  payment-data:
  notification-data:
