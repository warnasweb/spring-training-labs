server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
logging:
  structured:
    format:
      console: logstash
