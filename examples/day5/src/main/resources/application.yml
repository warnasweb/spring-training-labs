spring:
  application.name: day5-aop-cache-catalog
  datasource:
    url: jdbc:h2:mem:books;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2.console.enabled: true
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.format_sql: true
  cache:
    cache-names: books
    caffeine.spec: maximumSize=1000,expireAfterWrite=10m,recordStats
management.endpoints.web.exposure.include: health,info,caches,metrics
logging.level.com.warnasweb.training.books.observability: INFO
